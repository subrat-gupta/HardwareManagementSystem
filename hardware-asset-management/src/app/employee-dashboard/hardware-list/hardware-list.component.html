<h2>Available Hardware</h2>
<mat-table [dataSource]="hardwareList" class="mat-elevation-z8">
  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef> Name </mat-header-cell>
    <mat-cell *matCellDef="let hardware"> {{ hardware.name }} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="serialNumber">
    <mat-header-cell *matHeaderCellDef> Serial Number </mat-header-cell>
    <mat-cell *matCellDef="let hardware"> {{ hardware.serialNumber }} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="status">
    <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
    <mat-cell *matCellDef="let hardware"> {{ hardware.status }} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="request">
    <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
    <mat-cell *matCellDef="let hardware">
      <button mat-button color="primary" (click)="requestHardware(hardware)">
        Request
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>
