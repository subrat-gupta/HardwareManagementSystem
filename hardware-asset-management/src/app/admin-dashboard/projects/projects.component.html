<div class="container">
  <h2 class="title">Projects</h2>

  <button mat-raised-button color="primary" [routerLink]="'new'" style="margin-bottom: 16px;">
    Add Project
  </button>

  <table mat-table [dataSource]="projects" class="mat-elevation-z3 full-width-table">

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let project">{{ project.name }}</td>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let project">{{ project.description }}</td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let project">{{ project.status }}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let project">
        <button mat-icon-button color="warn" (click)="deleteProject(project.projectId)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['name', 'description', 'status', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['name', 'description', 'status', 'actions'];"></tr>
  </table>
</div>
